apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: k8s-gitops-deploy
      app.kubernetes.io/managed-by: argocd
resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
configMapGenerator:
  - name: release-info-config
    literals:
      - SERVICE_NAME=release-info
      - ENVIRONMENT=base
