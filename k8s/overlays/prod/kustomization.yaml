apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: release-info-prod
resources:
  - ../../base
  - namespace.yaml
  - hpa.yaml
replicas:
  - name: release-info
    count: 3
configMapGenerator:
  - name: release-info-config
    behavior: merge
    literals:
      - ENVIRONMENT=prod
patches:
  - target:
      kind: PodDisruptionBudget
      name: release-info
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
# Promoted to prod by a reviewed merge request that copies the tag from the dev overlay.
images:
  - name: ghcr.io/sonubepop/k8s-gitops-deploy
    newTag: latest
